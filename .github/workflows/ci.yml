name: Android checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Unit tests, lint and APK build
        run: ./gradlew :core:protocol:test testDebugUnitTest lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-reports
          path: |
            **/build/reports/
          retention-days: 14

  device-preview:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'lingmulongtai/Okuyuki-quest' && github.ref == 'refs/heads/codex/panorama-transfer'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build and verify installable preview
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain
          mkdir -p preview
          cp app/build/outputs/apk/release/app-release.apk preview/Okuyuki-quest-v0.1.0-alpha.9-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs preview/*.apk > preview/signature.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: b67d2d74d73b2649d35c2e81e9e8b547801cf69ab387c2b741f75d78da3abd31' preview/signature.txt
          test "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' preview/signature.txt)" = 1
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging preview/*.apk > preview/package.txt
          grep -F "name='com.okuyuki.quest' versionCode='8' versionName='0.1.0-alpha.9-preview'" preview/package.txt
          cp docs/third-party/* preview/
          curl --fail --location --retry 3 https://codeload.github.com/strukturag/libheif/tar.gz/refs/tags/v1.23.6 -o preview/libheif-1.23.6-source.tar.gz
          curl --fail --location --retry 3 https://codeload.github.com/strukturag/libde265/tar.gz/refs/tags/v1.1.3 -o preview/libde265-1.1.3-source.tar.gz
          echo 'c9a00b0452f5c16d72ef71e5e40c0e90fbe2ad37148d27a1b2f9bb21546f5f03  preview/libheif-1.23.6-source.tar.gz' | sha256sum --check
          echo '189baa08fd6d2dd34db099de411bd6b2e6bd5eb88e81236a3d0fa3826b9715c4  preview/libde265-1.1.3-source.tar.gz' | sha256sum --check
          (cd preview && sha256sum *.apk *.tar.gz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quest-device-preview
          path: preview/
          retention-days: 14
